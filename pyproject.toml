[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mchub"
version = "11.4.2"
description = ""
authors = [
    { name = "Frédéric Fortier-Chouinard" },
    { name = "Félix-Antoine Fortin", email = "felix-antoine.fortin@calculquebec.ca" },
]
requires-python = "~=3.13.0"
license = "BSD-3-Clause"
dependencies = [
    "Flask>=3.1.3,<4",
    "Flask-SQLAlchemy>=3.1.1,<4",
    "SQLAlchemy>=2.0.52,<3",
    "humanize>=4.16.0,<5",
    "marshmallow>=4.3.1,<5",
    "openstacksdk>=4.20.0,<5",
    "jsonpath-ng>=1.8.0,<2",
    "Flask-Cors>=6.0.5,<7",
    "cachetools>=7.1.8,<8",
    "pygithub>=2.10.0,<3",
    "gunicorn[gevent]>=26.2.0,<27",
    "flask-migrate>=4.1.0,<5",
    "PyYAML>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-flask>=1.3.0,<2",
    "pytest-mock>=3.15.1,<4",
    "freezegun>=1.5.5,<2",
]
