name: Build, test and deploy

on:
  push:
  pull_request:

env:
  IMAGE_NAME: "cmdntrf/mc-hub"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    name: Validate frontend
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install NPM dependencies
        run: npm ci
      - name: Lint frontend and browser checks
        run: |
          npm run lint -- --no-fix
          npx eslint tests/browser/smoke.cjs
      - name: Run frontend unit tests
        run: npm run test:unit -- --runInBand
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run production browser checks
        run: npm run test:browser
  backend:
    runs-on: ubuntu-24.04
    name: Test backend
    steps:
      - uses: actions/checkout@v6
      - name: Create run folder
        run: |
          mkdir -p run
          mkdir -p run/database
          mkdir -p run/clusters
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Run backend regular tests
        working-directory: ./run
        run: |
          export MAGIC_CASTLE_PATH=$PWD/magic_castle
          uv run pytest ../
  container:
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    name: Build container
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker build --tag "$IMAGE_NAME" --target production-server .
      - name: Deploy to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "$IMAGE_NAME" "${IMAGE_NAME}:latest"
          docker tag "$IMAGE_NAME" "${IMAGE_NAME}:$(git describe --tags --abbrev=0)"
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker push "${IMAGE_NAME}:latest" && docker push "${IMAGE_NAME}:$(git describe --tags --abbrev=0)"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
